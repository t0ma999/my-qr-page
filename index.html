<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выберите сотрудника</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <header class="header">
            <h1>Выберите сотрудника</h1>
            <p>Оставьте чаевые тому, кто сегодня сделал ваш день лучше <span class="emoji">😊</span></p>
        </header>

        <main class="staff-list">

            <a href="https://pay.cloudtips.ru/p/0fc25c49" class="staff-card">
                <img src="avatars/Tatiana.jpg" class="avatar">
                <div class="info">
                    <div class="name">Татьяна</div>
                    <div class="role">Управляющий</div>
                </div>
                <div class="arrow">
                    <svg viewBox="0 0 10 18"><path d="M1 1l7 8-7 8"/></svg>
                </div>
            </a>

            <a href="https://pay.cloudtips.ru/p/0fc25c49" class="staff-card">
                <img src="avatars/Yulia.jpg" class="avatar">
                <div class="info">
                    <div class="name">Юлия</div>
                    <div class="role">Бомж</div>
                </div>
                <div class="arrow">
                    <svg viewBox="0 0 10 18"><path d="M1 1l7 8-7 8"/></svg>
                </div>
            </a>

            <a href="https://pay.cloudtips.ru/p/0fc25c49" class="staff-card">
                <img src="avatars/5.jpg" class="avatar">
                <div class="info">
                    <div class="name">Андрей</div>
                    <div class="role">Бог</div>
                </div>
                <div class="arrow">
                    <svg viewBox="0 0 10 18"><path d="M1 1l7 8-7 8"/></svg>
                </div>
            </a>

        </main>

        <footer class="footer">
            <div class="footer-thanks">
                <svg width="16" height="15" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="heart-icon">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <span>Спасибо!</span>
            </div>
            <div>Ваша поддержка очень важна для нас</div>
        </footer>

    </div>

</body>
</html>
